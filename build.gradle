plugins {
    id 'dev.architectury.loom' version '1.6.422'
    id 'java'
}

version = project.mod_version
group = 'dev.bedrockify.forge'
base { archivesName = 'bedrockify-forge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
loom {
    accessWidenerPath = file('src/main/resources/bedrockify.accesswidener')
    mixin { defaultRefmapName = 'bedrockify-forge-refmap.json' }
    forge {
        mixinConfig 'bedrockify.mixins.json'
        convertAccessWideners = true
        extraAccessWideners.add 'bedrockify.accesswidener'
    }
    runs {
        client { runDir 'run/client' }
        server { runDir 'run/server' }
    }
}
repositories {
    maven { url 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
}
sourceSets.main.resources.srcDir 'src/main/generated'
// Development sources are opt-in and must not enter a release JAR.
def testProfiles = [
    chemistryUiClient: [side: 'client', sources: ['chemistry-ui-client'], dir: 'chemistry-ui-client', size: ['1280', '960']],
    chemistryUiGameTests: [side: 'server', sources: ['education2-tests', 'chemistry-ui-tests'], dir: 'chemistry-ui-tests'],
    guiTextClient: [side: 'client', sources: ['gui-text-client'], dir: 'alpha17-snow-book', size: ['1280', '720']],
    snowBookClient: [side: 'client', sources: ['snow-book-client'], dir: 'alpha17-snow-book', size: ['1280', '720']],
    inventoryUiClient: [side: 'client', sources: ['inventory-ui-client'], dir: 'inventory-ui-client', size: ['1280', '720']],
    education2Client: [side: 'client', sources: ['education2-client'], dir: 'education2-client'],
    education2GameTests: [side: 'server', sources: ['education2-tests'], dir: 'education2-tests'],
    alpha14Regression: [side: 'client', sources: ['alpha14-regression'], dir: 'alpha14-regression'],
    armorStandGameTests: [side: 'server', sources: ['armorstand-tests'], dir: 'armorstand-tests'],
    alpha14ClientSmoke: [side: 'client', sources: ['client-smoke-tests'], dir: 'alpha14-client-smoke', quickPlay: false],
    waterColorClientSmoke: [side: 'client', sources: ['water-color-tests'], dir: 'alpha15-water-smoke', quickPlay: false],
    alpha16GameTests: [side: 'server', sources: ['alpha16-tests'], dir: 'alpha16-tests', resources: ['alpha16-tests/resources']],
    mechanicsGameTests: [side: 'server', sources: ['mechanics-tests'], dir: 'mechanics-tests', resources: ['mechanics-tests/resources']],
    alpha17GameTests: [side: 'server', sources: ['alpha17-tests'], dir: 'alpha17-tests']
]
def selectedProfiles = testProfiles.findAll { name, profile -> project.hasProperty(name) }
if (selectedProfiles.size() > 1) {
    throw new GradleException("Select one development test profile at a time: ${selectedProfiles.keySet().join(', ')}")
}
selectedProfiles.each { name, profile ->
    sourceSets.main.java.srcDirs profile.sources.collect { "docs/tools/${it}" }
    def run = loom.runs.getByName(profile.side)
    run.runDir "run/${profile.dir}"
    if (profile.side == 'server') {
        def resourceDirectories = (profile.resources ?: ['armorstand-tests/resources']).collect { "docs/tools/${it}" }
        sourceSets.main.resources.srcDirs resourceDirectories
        // Reactor fixtures supplement the shared empty structure.
        if (name == 'alpha16GameTests') sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
        run.vmArg '-Dforge.gameTestServer=true'
        run.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    } else {
        if (profile.quickPlay != false) run.programArgs '--quickPlaySingleplayer', 'regression'
        if (profile.size) run.programArgs '--width', profile.size[0], '--height', profile.size[1]
    }
}
processResources {
    exclude '.cache/**'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Direct file output avoids a truncated Filer resource with the legacy Forge Mixin processor.
    doFirst {
        options.compilerArgs.removeAll { it.startsWith('-AoutRefMapFile=') }
        options.compilerArgs.add("-AoutRefMapFile=${destinationDirectory.get().file('bedrockify-forge-refmap.json').asFile.absolutePath}")
    }
}
tasks.register('validateRefmap') {
    dependsOn tasks.named('compileJava')
    doLast {
        def refmap = new groovy.json.JsonSlurper().parse(file('build/classes/java/main/bedrockify-forge-refmap.json'))
        if (!refmap.mappings || !refmap.data) throw new GradleException('Mixin reference map is incomplete')
    }
}
tasks.register('validateBedrockAdvancements') {
    def advancementDir = file('src/main/resources/data/bedrockify/advancements/bedrock')
    inputs.dir advancementDir
    inputs.files file('src/main/resources/assets/bedrockify/lang/en_us.json'),
            file('src/main/resources/assets/bedrockify/lang/zh_cn.json')
    doLast {
        def json = new groovy.json.JsonSlurper()
        def advancements = advancementDir.listFiles().findAll { it.name.endsWith('.json') }
                .collectEntries { [(it.name.dropRight(5)): json.parse(it)] }
        if (advancements.size() != 90 || advancements.keySet().count { it.startsWith('stage_') } != 7)
            throw new GradleException('Expected 82 Bedrock achievements, seven stages and one root')
        def locales = ['en_us', 'zh_cn'].collect {
            json.parse(file("src/main/resources/assets/bedrockify/lang/${it}.json"))
        }
        advancements.each { name, advancement ->
            if (name != 'root' && !advancements.containsKey(advancement.parent?.tokenize('/')?.last()))
                throw new GradleException("Missing Bedrock advancement parent: ${name}")
            def visited = [] as Set
            def current = name
            while (current != 'root') {
                if (!visited.add(current))
                    throw new GradleException("Bedrock advancement parent cycle: ${name}")
                current = advancements[current].parent.tokenize('/').last()
            }
            if (!advancement.criteria || !advancement.requirements)
                throw new GradleException("Missing Bedrock advancement criteria: ${name}")
            advancement.requirements.flatten().each { criterion ->
                if (!advancement.criteria.containsKey(criterion))
                    throw new GradleException("Unknown criterion ${criterion} in ${name}")
            }
            ['title', 'description'].each { field ->
                def key = advancement.display?.get(field)?.translate
                if (!key || locales.any { !it.containsKey(key) })
                    throw new GradleException("Missing en_us/zh_cn ${field} for ${name}: ${key}")
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('validateRefmap') }
tasks.named('check') { dependsOn tasks.named('validateBedrockAdvancements') }
tasks.named('jar') { dependsOn tasks.named('validateRefmap') }
jar {
    exclude '.cache', '.cache/**', '**/.cache', '**/.cache/**'
    from 'LICENSE'; from 'NOTICE'
    manifest.attributes 'MixinConfigs': 'bedrockify.mixins.json'
}
