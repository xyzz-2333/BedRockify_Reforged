plugins {
    id 'dev.architectury.loom' version '1.6.422'
    id 'java'
}

version = project.mod_version
group = 'dev.bedrockify.forge'
base { archivesName = 'bedrockify-forge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
loom {
    accessWidenerPath = file('src/main/resources/bedrockify.accesswidener')
    mixin { defaultRefmapName = 'bedrockify-forge-refmap.json' }
    forge {
        mixinConfig 'bedrockify.mixins.json'
        convertAccessWideners = true
        extraAccessWideners.add 'bedrockify.accesswidener'
    }
    runs {
        client { runDir 'run/client' }
        server { runDir 'run/server' }
    }
}
repositories {
    maven { url 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
}
sourceSets.main.resources.srcDir 'src/main/generated'
if (project.hasProperty('chemistryUiClient')) {
    sourceSets.main.java.srcDir 'docs/tools/chemistry-ui-client'
    loom.runs.client.runDir 'run/chemistry-ui-client'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression', '--width', '1280', '--height', '960'
}
if (project.hasProperty('chemistryUiGameTests')) {
    sourceSets.main.java.srcDirs 'docs/tools/education2-tests', 'docs/tools/chemistry-ui-tests'
    sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/chemistry-ui-tests'
}
if (project.hasProperty('guiTextClient')) {
    sourceSets.main.java.srcDir 'docs/tools/gui-text-client'
    loom.runs.client.runDir 'run/alpha17-snow-book'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression', '--width', '1280', '--height', '720'
}
if (project.hasProperty('snowBookClient')) {
    sourceSets.main.java.srcDir 'docs/tools/snow-book-client'
    loom.runs.client.runDir 'run/alpha17-snow-book'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression', '--width', '1280', '--height', '720'
}
if (project.hasProperty('inventoryUiClient')) {
    sourceSets.main.java.srcDir 'docs/tools/inventory-ui-client'
    loom.runs.client.runDir 'run/inventory-ui-client'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression', '--width', '1280', '--height', '720'
}
if (project.hasProperty('education2Client')) {
    sourceSets.main.java.srcDir 'docs/tools/education2-client'
    loom.runs.client.runDir 'run/education2-client'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression'
}
if (project.hasProperty('education2GameTests')) {
    sourceSets.main.java.srcDir 'docs/tools/education2-tests'
    sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/education2-tests'
}
if (project.hasProperty('alpha14Regression')) {
    sourceSets.main.java.srcDir 'docs/tools/alpha14-regression'
    loom.runs.client.runDir 'run/alpha14-regression'
    loom.runs.client.programArgs '--quickPlaySingleplayer', 'regression'
}
if (project.hasProperty('armorStandGameTests')) {
    sourceSets.main.java.srcDir 'docs/tools/armorstand-tests'
    sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/armorstand-tests'
}
if (project.hasProperty('alpha14ClientSmoke')) {
    sourceSets.main.java.srcDir 'docs/tools/client-smoke-tests'
    loom.runs.client.runDir 'run/alpha14-client-smoke'
}
if (project.hasProperty('waterColorClientSmoke')) {
    sourceSets.main.java.srcDir 'docs/tools/water-color-tests'
    loom.runs.client.runDir 'run/alpha15-water-smoke'
}
// Mechanics tests remain outside the release JAR unless explicitly enabled.
if (project.hasProperty('alpha16GameTests')) {
    sourceSets.main.java.srcDir 'docs/tools/alpha16-tests'
    sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
    sourceSets.main.resources.srcDir 'docs/tools/alpha16-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/alpha16-tests'
}
if (project.hasProperty('mechanicsGameTests')) {
    sourceSets.main.java.srcDir 'docs/tools/mechanics-tests'
    if (!project.hasProperty('alpha16GameTests')) sourceSets.main.resources.srcDir 'docs/tools/mechanics-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/mechanics-tests'
}
if (project.hasProperty('alpha17GameTests')) {
    sourceSets.main.java.srcDir 'docs/tools/alpha17-tests'
    sourceSets.main.resources.srcDir 'docs/tools/armorstand-tests/resources'
    loom.runs.server.vmArg '-Dforge.gameTestServer=true'
    loom.runs.server.vmArg '-Dforge.enabledGameTestNamespaces=bedrockify'
    loom.runs.server.runDir 'run/alpha17-tests'
}
processResources {
    exclude '.cache/**'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Direct file output avoids a truncated Filer resource with the legacy Forge Mixin processor.
    doFirst {
        options.compilerArgs.removeAll { it.startsWith('-AoutRefMapFile=') }
        options.compilerArgs.add("-AoutRefMapFile=${destinationDirectory.get().file('bedrockify-forge-refmap.json').asFile.absolutePath}")
    }
}
tasks.register('validateRefmap') {
    dependsOn tasks.named('compileJava')
    doLast {
        def refmap = new groovy.json.JsonSlurper().parse(file('build/classes/java/main/bedrockify-forge-refmap.json'))
        if (!refmap.mappings || !refmap.data) throw new GradleException('Mixin reference map is incomplete')
    }
}
tasks.register('validateBedrockAdvancements') {
    def advancementDir = file('src/main/resources/data/bedrockify/advancements/bedrock')
    inputs.dir advancementDir
    inputs.files file('src/main/resources/assets/bedrockify/lang/en_us.json'),
            file('src/main/resources/assets/bedrockify/lang/zh_cn.json')
    doLast {
        def json = new groovy.json.JsonSlurper()
        def advancements = advancementDir.listFiles().findAll { it.name.endsWith('.json') }
                .collectEntries { [(it.name.dropRight(5)): json.parse(it)] }
        if (advancements.size() != 90 || advancements.keySet().count { it.startsWith('stage_') } != 7)
            throw new GradleException('Expected 82 Bedrock achievements, seven stages and one root')
        def locales = ['en_us', 'zh_cn'].collect {
            json.parse(file("src/main/resources/assets/bedrockify/lang/${it}.json"))
        }
        advancements.each { name, advancement ->
            if (name != 'root' && !advancements.containsKey(advancement.parent?.tokenize('/')?.last()))
                throw new GradleException("Missing Bedrock advancement parent: ${name}")
            def visited = [] as Set
            def current = name
            while (current != 'root') {
                if (!visited.add(current))
                    throw new GradleException("Bedrock advancement parent cycle: ${name}")
                current = advancements[current].parent.tokenize('/').last()
            }
            if (!advancement.criteria || !advancement.requirements)
                throw new GradleException("Missing Bedrock advancement criteria: ${name}")
            advancement.requirements.flatten().each { criterion ->
                if (!advancement.criteria.containsKey(criterion))
                    throw new GradleException("Unknown criterion ${criterion} in ${name}")
            }
            ['title', 'description'].each { field ->
                def key = advancement.display?.get(field)?.translate
                if (!key || locales.any { !it.containsKey(key) })
                    throw new GradleException("Missing en_us/zh_cn ${field} for ${name}: ${key}")
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('validateRefmap') }
tasks.named('check') { dependsOn tasks.named('validateBedrockAdvancements') }
tasks.named('jar') { dependsOn tasks.named('validateRefmap') }
jar {
    exclude '.cache', '.cache/**', '**/.cache', '**/.cache/**'
    from 'LICENSE'; from 'NOTICE'
    manifest.attributes 'MixinConfigs': 'bedrockify.mixins.json'
}
